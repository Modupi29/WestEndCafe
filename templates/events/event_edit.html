{% extends "registration/index.html" %}
{% load static %}

{% block main_content %}
<div class="container mt-5">
    <h2>{% if event %}Edit{% else %}New{% endif %} Event</h2>
    <form method="post" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
            <label for="name" class="form-label">Event Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ event.name|default_if_none:'' }}" required>
        </div>
        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" name="date" value="{{ event.date|default_if_none:'' }}" required>
        </div>
        <div class="mb-3">
            <label for="time" class="form-label">Time</label>
            <input type="time" class="form-control" id="time" name="time" value="{{ event.time|default_if_none:'' }}" required>
        </div>
        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" id="location" name="location" value="{{ event.location|default_if_none:'' }}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4">{{ event.description|default_if_none:'' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">{% if event %}Update{% else %}Create{% endif %}</button>
        <a href="{% url 'event_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock main_content %}
