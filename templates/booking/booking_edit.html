{% extends "registration/index.html" %}
{% load static %}

{% block main_content %}

<div class="container mt-5">
    <h2>{% if booking %}Edit{% else %}New{% endif %} Booking</h2>

    <form method="post" class="mt-3">
        {% csrf_token %}

        <!-- Customer Name -->
        <div class="mb-3">
            <label for="customer_name" class="form-label">Customer Name</label>
            <input type="text" class="form-control" id="customer_name" name="customer_name"
                   value="{{ booking.name|default_if_none:'' }}" required>
        </div>

        <!-- Date -->
        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" name="date"
                   value="{{ booking.booking_date|date:'Y-m-d'|default_if_none:'' }}" required>
        </div>

        <!-- Time -->
        <div class="mb-3">
            <label for="time" class="form-label">Time</label>
            <input type="time" class="form-control" id="time" name="time"
                   value="{{ booking.booking_time|time:'H:i'|default_if_none:'' }}" required>
        </div>

        <!-- Number of Guests -->
        <div class="mb-3">
            <label for="guests" class="form-label">Number of Guests</label>
            <input type="number" class="form-control" id="guests" name="guests"
                   value="{{ booking.num_guests|default_if_none:'' }}" min="1" required>
        </div>

        <!-- Submit / Cancel Buttons -->
        <button type="submit" class="btn btn-primary">
            {% if booking %}Update{% else %}Book{% endif %}
        </button>
        <a href="{% url 'booking_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock main_content %}
