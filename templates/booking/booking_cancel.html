{% extends "registration/index.html" %}
{% block main_content %}
<div class="container mt-5">
    <h3>Are you sure you want to cancel the booking for {{ booking.name }}?</h3>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Cancel</button>
        <a href="{% url 'booking_list' %}" class="btn btn-secondary">No, Go Back</a>
    </form>
</div>
{% endblock main_content %}
