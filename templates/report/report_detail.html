{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ report.title }} | Report Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <a href="{% url 'report_list' %}" class="btn btn-outline-secondary mb-3">&larr; Back to Reports</a>

  <div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">{{ report.title }}</h4>
    </div>
    <div class="card-body">
      <p><strong>Generated on:</strong> {{ report.created_at|date:"Y-m-d H:i" }}</p>
      <p><strong>Type:</strong> {{ report.report_type }}</p>
      <hr>
      <p>{{ report.content|linebreaks }}</p>
    </div>
  </div>
</div>

<footer class="text-center bg-dark text-light py-3 mt-5">
  <small>&copy; 2025 West End Cafe</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
