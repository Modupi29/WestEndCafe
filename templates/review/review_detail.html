{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'review_list' %}">Reviews</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'review_edit' review.id %}">Edit</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="{% url 'review_delete' review.id %}">Delete</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">{{ review.title }}</h3>
            </div>
            <div class="card-body">
                <p><strong>Rating:</strong> {{ review.rating }}/5</p>
                <p><strong>Date:</strong> {{ review.date }}</p>
                <hr>
                <p>{{ review.content }}</p>
            </div>
        </div>

        <a href="{% url 'review_list' %}" class="btn btn-secondary">Back to Reviews</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
