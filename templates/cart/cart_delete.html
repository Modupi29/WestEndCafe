{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <div class="card p-4 shadow-sm">
    <h3>Remove Item</h3>
    <p>Are you sure you want to remove <strong>{{ item.menu_item.name }}</strong> from your cart?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Remove</button>
      <a href="{% url 'cart_detail' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
