{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if order %}Edit{% else %}New{% endif %} Order - WestEndCafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>{% if order %}Edit{% else %}New{% endif %} Order</h2>
    <form method="post" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
            <label for="customer_name" class="form-label">Customer Name</label>
            <input type="text" class="form-control" id="customer_name" name="customer_name" value="{{ order.customer_name|default_if_none:'' }}" required>
        </div>

        <div class="mb-3">
            <label for="order_date" class="form-label">Order Date</label>
            <input type="date" class="form-control" id="order_date" name="order_date" value="{{ order.order_date|default_if_none:'' }}" required>
        </div>

        <div class="mb-3">
            <label for="total_items" class="form-label">Total Items</label>
            <input type="number" class="form-control" id="total_items" name="total_items" value="{{ order.total_items|default_if_none:'1' }}" min="1" required>
        </div>

        <div class="mb-3">
            <label for="total_price" class="form-label">Total Price (R)</label>
            <input type="number" class="form-control" id="total_price" name="total_price" value="{{ order.total_price|default_if_none:'0.00' }}" step="0.01" required>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Order Status</label>
            <select class="form-select" id="status" name="status" required>
                <option value="Pending" {% if order.status == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Processing" {% if order.status == 'Processing' %}selected{% endif %}>Processing</option>
                <option value="Completed" {% if order.status == 'Completed' %}selected{% endif %}>Completed</option>
                <option value="Cancelled" {% if order.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">{% if order %}Update{% else %}Place Order{% endif %}</button>
        <a href="{% url 'order_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
