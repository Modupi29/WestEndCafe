{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | West End Cafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-center mb-4">Menu Categories</h2>
    <div class="list-group">
        {% for category in categories %}
            <a href="{% url 'menu_by_category' category.id %}" class="list-group-item list-group-item-action">
                {{ category.name }}
            </a>
        {% empty %}
            <p class="text-muted text-center">No categories available.</p>
        {% endfor %}
    </div>
</div>

<footer class="text-center py-3 bg-dark text-light">
    <small>&copy; 2025 West End Cafe</small>
</footer>
</body>
</html>
