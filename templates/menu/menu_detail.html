{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ item.name }} | Menu | West End Cafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <a href="{% url 'menu_list' %}" class="btn btn-outline-secondary mb-4">&larr; Back to Menu</a>

    <div class="row">
        <div class="col-md-6">
            {% if item.image %}
                <img src="{{ item.image.url }}" class="img-fluid rounded shadow-sm" alt="{{ item.name }}">
            {% else %}
                <img src="{% static 'images/placeholder.png' %}" class="img-fluid rounded shadow-sm" alt="No image">
            {% endif %}
        </div>
        <div class="col-md-6">
            <h2>{{ item.name }}</h2>
            <p class="text-muted">{{ item.category.name }}</p>
            <p>{{ item.description }}</p>
            <h4 class="fw-bold text-success mb-3">R{{ item.price }}</h4>
            <a href="{% url 'add_to_cart' item.id %}" class="btn btn-primary btn-lg">Add to Cart</a>
        </div>
    </div>
</div>

<footer class="text-center py-3 bg-dark text-light">
    <small>&copy; 2025 West End Cafe</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
